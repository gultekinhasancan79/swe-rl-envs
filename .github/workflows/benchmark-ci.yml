name: Benchmark CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment:
          - runlog-rollup
          - cursor-pagination

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build pinned task image
        working-directory: envs/${{ matrix.environment }}
        run: docker build -t "${{ matrix.environment }}:ci" .

      - name: Materialize golden candidate
        working-directory: envs/${{ matrix.environment }}
        run: bash golden/apply.sh "$RUNNER_TEMP/golden-candidate"

      - name: Run all verifier gates
        working-directory: envs/${{ matrix.environment }}
        run: |
          docker run --rm --network none \
            --read-only --tmpfs /tmp:rw,exec,nosuid,size=256m \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 1g --pids-limit 256 \
            -v "$RUNNER_TEMP/golden-candidate:/work/repo:ro" \
            -v "$PWD/heldout:/verify/heldout:ro" \
            -v "$PWD/verify.sh:/verify/verify.sh:ro" \
            "${{ matrix.environment }}:ci" bash /verify/verify.sh

  walkthrough:
    name: Reviewer walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check walkthrough failure classification
        run: python3 -m unittest discover -s tests -v

      - name: Verify seeded, partial and reference candidates
        run: python3 examples/verification_walkthrough.py --output-dir "$RUNNER_TEMP/cursor-walkthrough"

      - name: Preserve verification logs and metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cursor-pagination-walkthrough
          path: |
            ${{ runner.temp }}/cursor-walkthrough/*.log
            ${{ runner.temp }}/cursor-walkthrough/metadata.json
          if-no-files-found: ignore
          retention-days: 30
